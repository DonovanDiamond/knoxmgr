<!doctype html>
<!--
PLAN (rendition 03, Field coordinator)
1. Palette: cobalt #1F4FD1 (primary), ice #EEF3FF (page wash / tints), ink #14181F (text), white, mint #1E9E6A (success), coral #D2453D (destructive). Dark: ink-blue #0F131A base, cobalt lifted to #7B9BFF.
2. Type: Figtree only, 400/500/600/800. Body 16px+. Chips 13px/600.
3. Bold element: page titles, clamp(48px, 9vw, 56px), weight 800, tracking -0.045em. They shrink into the sticky header (small title fades in) once scrolled past. Everything else is quiet.
4. Mobile first. People are rows, not table cells: 52px initials avatar (tap = select), name, email, org, state chip at right.
5. Actions: fixed bottom action bar above the tab bar on phones; sticky side panel on md+ (same action list feeds both).
6. Desktop: one centered column pair (max 1040px: list + 300px panel). Never a wide grid.
7. Radii: sheets/dialogs 24px top (mobile) / 20px (desktop), chips full, inputs 10px, buttons 12px.
8. State encoded by chip colour: mint enrolled, cobalt invite sent, grey not invited, coral no email (cannot be invited).
9. daisyUI 5 custom themes fclight/fcdark set through CSS variables; Tailwind v4 browser build.
10. Layout ASCII:
   phone:               desktop:
   [ Knoxmgr  Users  o]   [ Knoxmgr  Users Groups Admin   o ]
   Users (56px)           Users (56px)
   [search][org]          [search][org]        | Selected 3   |
   (TM) Thandi  [chip]    (TM) Thandi  [chip]  | counts       |
   (SD) Sipho   [chip]    ...                  | [Send invite]|
   [Add user][Send (3)]                        | [Add user]   |
   [Users Groups Admin]
Generic check: not cream/terracotta, not black/acid green, no hairline broadsheet, no gradient washes. OK.
-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knoxmgr - Field coordinator rendition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43/daisyui.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style>
  [data-theme=fclight]{

    --color-primary:#1F4FD1; --color-primary-content:#fff;
    --color-secondary:#14181F; --color-secondary-content:#fff;
    --color-accent:#1F4FD1; --color-accent-content:#fff;
    --color-neutral:#14181F; --color-neutral-content:#fff;
    --color-info:#1F4FD1; --color-info-content:#fff;
    --color-success:#1E9E6A; --color-success-content:#fff;
    --color-warning:#B7791F; --color-warning-content:#fff;
    --color-error:#D2453D; --color-error-content:#fff;
    --radius-selector:1rem; --radius-field:.625rem; --radius-box:1.25rem;
    --size-selector:.25rem; --size-field:.25rem; --border:1px; --depth:0; --noise:0;
    --muted:#586174; --line:#DCE3F3;
  }
  [data-theme=fcdark]{
    color-scheme:dark;
    --color-base-100:#0F131A; --color-base-200:#171D29; --color-base-300:#2A3550; --color-base-content:#E9EDF6;
    --color-primary:#7B9BFF; --color-primary-content:#0B1020;
    --color-secondary:#E9EDF6; --color-secondary-content:#0F131A;
    --color-accent:#7B9BFF; --color-accent-content:#0B1020;
    --color-neutral:#E9EDF6; --color-neutral-content:#0F131A;
    --color-info:#7B9BFF; --color-info-content:#0B1020;
    --color-success:#3CC48D; --color-success-content:#06150F;
    --color-warning:#E0A94A; --color-warning-content:#1b1204;
    --color-error:#F0716A; --color-error-content:#1c0705;
    --radius-selector:1rem; --radius-field:.625rem; --radius-box:1.25rem;
    --size-selector:.25rem; --size-field:.25rem; --border:1px; --depth:0; --noise:0;
    --muted:#9AA5BD; --line:#252E44;
  }
  html{font-family:'Figtree',system-ui,sans-serif;font-size:16px;scroll-padding-top:72px}
  body{font-family:'Figtree',system-ui,sans-serif;background:var(--color-base-100);color:var(--color-base-content);min-height:100dvh}
  button,input,select,textarea{font-family:inherit}
  :focus-visible{outline:3px solid var(--color-primary);outline-offset:2px}
  .muted{color:var(--muted)}
  .big{font-size:clamp(48px,9vw,56px);line-height:1;letter-spacing:-.045em;font-weight:800;margin:20px 0 20px;text-wrap:balance}
  .hdr{height:56px;background:color-mix(in oklab,var(--color-base-100) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
  .hdr.scrolled{border-bottom-color:var(--line)}
  .hdr-title{font-weight:800;letter-spacing:-.03em;font-size:20px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr.scrolled .hdr-title{opacity:1;transform:none}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:13px;font-weight:600;color:var(--muted);flex:1;min-height:56px;justify-content:center}
  .tab[aria-current=page]{color:var(--color-primary)}
  .dtab{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
  .dtab[aria-current=page]{background:var(--color-base-200);color:var(--color-primary)}
  .btn{font-weight:600;min-height:48px;border-radius:12px;font-size:16px;box-shadow:none}
  .btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-content)}
  .btn-soft2{background:var(--color-base-200);color:var(--color-base-content);border-color:transparent}
  .btn-danger{background:var(--color-error);border-color:var(--color-error);color:var(--color-error-content)}
  .btn-quiet-danger{background:transparent;color:var(--color-error);border-color:transparent}
  .btn[disabled],.btn:disabled{background:var(--color-base-300);color:var(--muted);opacity:.7;border-color:transparent}
  .field{height:48px;border-radius:10px;border:1px solid var(--color-base-300);background:var(--color-base-100);padding:0 14px;width:100%;font-size:16px}
  .field:focus{border-color:var(--color-primary)}
  .field[aria-invalid=true]{border-color:var(--color-error);border-width:2px}
  .lbl{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
  .err{color:var(--color-error);font-size:14px;margin-top:6px;font-weight:500}
  .hint{color:var(--muted);font-size:14px;margin-top:6px}
  .row{display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 0;border-bottom:1px solid var(--line)}
  .av{flex:none;width:52px;height:52px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-.01em;background:var(--color-base-200);color:var(--color-primary);transition:background .15s,color .15s}
  .av.t1{background:color-mix(in oklab,var(--color-success) 16%,var(--color-base-100));color:var(--color-success)}
  .av.t2{background:color-mix(in oklab,var(--color-base-content) 9%,var(--color-base-100));color:var(--color-base-content)}
  .av.sm{width:44px;height:44px;font-size:16px}
  .av[aria-pressed=true]{background:var(--color-primary);color:var(--color-primary-content)}
  .av:disabled{cursor:default}
  .nm{font-weight:600;font-size:17px;line-height:1.25}
  .sub{color:var(--muted);font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowmain{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;padding:4px 0}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--color-base-200);color:var(--muted)}
  .chip::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor}
  .s-enrolled{background:color-mix(in oklab,var(--color-success) 14%,var(--color-base-100));color:var(--color-success)}
  .s-invited{background:color-mix(in oklab,var(--color-primary) 13%,var(--color-base-100));color:var(--color-primary)}
  .s-none{background:var(--color-base-200);color:var(--muted)}
  .s-noemail{background:color-mix(in oklab,var(--color-error) 12%,var(--color-base-100));color:var(--color-error)}
  .plain{background:var(--color-base-200);color:var(--color-base-content)}
  .plain::before{display:none}
  .panel{border-radius:20px;background:var(--color-base-200);padding:20px}
  .modal-box{border-radius:24px 24px 0 0;max-width:34rem;padding:24px;background:var(--color-base-100);box-shadow:none}
  @media(min-width:640px){.modal-box{border-radius:20px}}
  .modal::backdrop,.modal{background:transparent}
  dialog.modal[open]{background:rgb(20 24 31 / .5)}
  .toast-msg{background:var(--color-neutral);color:var(--color-neutral-content);border-radius:12px;padding:12px 16px;font-weight:600}
  .seg{display:flex;background:var(--color-base-200);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;min-height:44px;border-radius:9px;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed=true]{background:var(--color-base-100);color:var(--color-base-content)}
  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  .note{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;background:var(--color-base-200);font-size:15px;line-height:1.35}
  .note.warn{background:color-mix(in oklab,var(--color-error) 10%,var(--color-base-100))}
  .note svg{flex:none;margin-top:2px}
  .toggle{--tglbg:var(--color-base-100)}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header id="hdr" class="hdr sticky top-0 z-30">
  <div class="mx-auto max-w-[1040px] h-full px-4 md:px-8 flex items-center gap-3">
    <button id="back" class="btn btn-ghost btn-circle -ml-2 hidden" aria-label="Back" data-act="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="brand" class="font-extrabold tracking-tight text-[18px] text-primary">Knoxmgr</span>
    <span id="hdr-title" class="hdr-title flex-1 min-w-0 md:hidden"></span>
    <nav id="dnav" class="hidden md:flex flex-1 gap-1 ml-4" aria-label="Main"></nav>
    <span class="flex-1 md:hidden"></span>
    <label class="sr-only" for="jump">Jump to screen</label>
    <select id="jump" class="field !h-10 !w-auto !text-[14px] !px-2 max-w-[8.5rem]">
      <option value="">Screens</option>
      <option value="signin">1 Sign in</option>
      <option value="users">2 Users list</option>
      <option value="form">3 Add or edit user</option>
      <option value="delete">4 Delete user</option>
      <option value="invited">5 Invite sent</option>
      <option value="groups">6 Groups list</option>
      <option value="group">7 Group detail</option>
      <option value="readonly">8 Read-only</option>
      <option value="admin">9 Admin</option>
    </select>
    <button id="theme" class="btn btn-ghost btn-circle !min-h-10 h-10 w-10" aria-label="Switch to dark theme"></button>
  </div>
</header>

<main id="main" class="mx-auto max-w-[1040px] px-4 md:px-8 pb-48 md:pb-20">
  <div id="grid" class="md:grid md:grid-cols-[minmax(0,1fr)_300px] md:gap-12">
    <div id="view" class="min-w-0"></div>
    <aside id="side" class="hidden md:block sticky top-[76px] self-start mt-[96px]" aria-label="Actions"></aside>
  </div>
</main>

<div id="bar" class="fixed bottom-0 inset-x-0 z-30 md:hidden bg-base-100 border-t" style="border-color:var(--line);padding-bottom:env(safe-area-inset-bottom)">
  <div id="actions" class="px-4 pt-3"></div>
  <nav id="mnav" class="flex px-2" aria-label="Main"></nav>
</div>

<dialog id="dlg" class="modal modal-bottom sm:modal-middle" aria-labelledby="dlg-title"></dialog>
<div id="toast" class="toast toast-top toast-center z-50 !top-16 pointer-events-none" aria-live="polite"></div>

<script>
/* ---------- data ---------- */
const ORGS=[{id:'ho',name:'Head Office',p:null},{id:'gp',name:'Gauteng',p:'ho'},{id:'jhb',name:'Johannesburg',p:'gp'},{id:'pta',name:'Pretoria',p:'gp'},{id:'wc',name:'Western Cape',p:'ho'},{id:'cpt',name:'Cape Town',p:'wc'},{id:'kzn',name:'KwaZulu-Natal',p:'ho'}];

const U=(id,first,last,email,o,state,contact,emp)=>({id,first,last,email,org:o,state,contact,emp});
let USERS=[

 {name:'Leadership',m:['lwazi.mahlangu','thandi.mokoena','pieter.botha']},
 {name:'Volunteers 2026',m:['lerato.khumalo','naledi.molefe','ayesha.patel','megan.naidoo','fatima.adams','zanele.nkosi']}];
const ACCOUNTS=[
 {u:'donovan.d',src:'Local',role:'Admin',org:'All organizations',acc:'Full access',off:false},
 {u:'thandi.mokoena',src:'AD',role:'User',org:'Gauteng',acc:'Read and write',off:false},

 {t:'Mon 14:22',who:'donovan.d',act:'Disabled account',tgt:'retired.coord',prev:'Disabled: no'},
 {t:'Mon 10:03',who:'donovan.d',act:'Deleted user',tgt:'test.user01',prev:'Name: Test User\nEmail: test.user01@vmin.example\nOrganization: Head Office'}];

/* ---------- state ---------- */
const S={screen:'users',role:'admin',scope:null,sel:new Set(),q:'',orgf:'all',editing:null,errors:{},vals:{},grp:0,tab:'accounts',stage:'form'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=u=>(u.first[0]+u.last.replace(/^van der /,'')[0]).toUpperCase();
const full=u=>u.first+' '+u.last;
const tone=u=>['','t1','t2'][(u.id.length+u.first.charCodeAt(0))%3];
const stateOf=u=>!u.email?['noemail','No email']:u.state==='enrolled'?['enrolled','Enrolled']:u.state==='invited'?['invited','Invite sent']:['none','Not invited'];
const chip=u=>{const[k,l]=stateOf(u);return `<span class="chip s-${k}">${l}</span>`};
const ico={
 sun:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>',
 users:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 8M22 21c0-3-1.5-5-4-5.7"/></svg>',
 groups:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',

 check:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'};

const canWrite=()=>S.role!=='read';
const orgName=()=>S.scope?org(S.scope).name:'';
const readReason=()=>`Your access to ${orgName()} is read-only`;
const visibleUsers=()=>USERS.filter(u=>(!S.scope||inScope(u.org,S.scope))&&(S.orgf==='all'||inScope(u.org,S.orgf))&&(!S.q||(full(u)+u.id+u.email).toLowerCase().includes(S.q.toLowerCase())));

/* ---------- navigation ---------- */
const TABS=()=>[['users','Users',ico.users],['groups','Groups',ico.groups],...(S.role==='admin'?[['admin','Admin',ico.admin]]:[])];
const TITLES={signin:'Sign in',users:'Users',form:'',groups:'Groups',group:'',admin:'Admin'};
function go(screen,o={}){
  S.screen=screen;Object.assign(S,o);
  S.scope=S.role==='admin'?null:'gp';
  render();window.scrollTo(0,0);
}
function render(){
  const sc=S.screen,view=$('#view');
  const noChrome=sc==='signin';
  $('#bar').style.display=noChrome?'none':'';
  $('#side').style.display=noChrome?'none':'';
  $('#grid').className=noChrome?'':'md:grid md:grid-cols-[minmax(0,1fr)_300px] md:gap-12';

function validate(v){
  const e={};
  if(!/^[a-z0-9][a-z0-9.-]{2,39}$/.test(v.userId))e.userId='User ID must be 3 to 40 lowercase letters, numbers, dots or dashes. Remove spaces and capitals.';
  else if(!S.editing&&USERS.some(u=>u.id===v.userId))e.userId=`"${esc(v.userId)}" is already taken. Choose another, for example ${esc(v.userId)}2.`;
  if(!v.userName.trim())e.userName='Enter the name to show in Knox, for example Thandi Mokoena.';
  if(!v.first.trim())e.first='Enter a first name.';
  if(!v.last.trim())e.last='Enter a last name.';
  if(v.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email))e.email='This email is missing a domain. Use the form name@example.org.';
  if(v.contact&&!/^\+?[0-9 ]{7,15}$/.test(v.contact))e.contact='Use digits only, 7 to 15 of them. For example 082 555 0141.';
  if(v.emp&&!/^[0-9]{3,10}$/.test(v.emp))e.emp='Employee numbers are digits only.';
  return e;
}

  const v={...S.vals};S.errors=validate(v);

  const rec=U(v.userId,v.first.trim(),v.last.trim(),v.email.trim(),v.org,'none',v.contact,v.emp);
  const i=USERS.findIndex(u=>u.id===v.userId);
  if(i>=0){rec.state=USERS[i].state;USERS[i]=rec}else USERS.unshift(rec);
  S.vals={};S.errors={};S.editing=null;toast(`Saved ${full(rec)}`);go('users');
}

  const t=e.target.closest('[data-go],[data-act],[data-sel],[data-edit],[data-group],[data-tab]');if(!t)return;
  const d=t.dataset;
  if(d.go){S.errors={};S.vals={};S.editing=null;if(d.go==='users'&&S.role==='read')S.role='write';go(d.go);return}
  if(d.sel){S.sel.has(d.sel)?S.sel.delete(d.sel):S.sel.add(d.sel);rows();return}
  if(d.edit){S.errors={};S.vals={};go('form',{editing:d.edit});return}
  if(d.group){go('group',{grp:+d.group});return}
  if(d.tab){S.tab=d.tab;vAdmin();panel();return}
  switch(d.act){
    case 'close':closeDlg();break;
    case 'back':S.errors={};S.vals={};S.editing=null;go(S.screen==='group'?'groups':'users');break;
    case 'add-user':S.errors={};S.vals={};go('form',{editing:null});break;
    case 'save-user':saveUser();break;
    case 'delete-user':openDeleteUser(S.editing);break;
    case 'invite':{const ids=[...S.sel];inviteDlg(ids);USERS.forEach(u=>{if(S.sel.has(u.id)&&u.email&&u.state==='none')u.state='invited'});S.sel.clear();rows();break}
    case 'add-members':pickerDlg();break;
    case 'remove-member':{const g=GROUPS[S.grp];g.m=g.m.filter(m=>m!==d.id);toast('Removed from '+g.name);vGroup();panel();break}
    case 'create-group':createGroupDlg();break;
    case 'delete-group':{const i=+d.i,g=GROUPS[i];deleteDlg({what:'group',key:g.name,btn:'Delete group',body:`This permanently deletes the group <strong>${esc(g.name)}</strong> in Knox. Its ${g.m.length} members keep their accounts.`,onOk:()=>{GROUPS.splice(i,1);toast(`Deleted ${g.name}`);vGroups();panel()}});break}
  }
});

$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='fclight');
function demo(n){
  closeDlg();S.sel.clear();S.q='';S.orgf='all';S.errors={};S.vals={};S.editing=null;S.tab='accounts';
  S.role='admin';
  switch(n){
    case 'signin':go('signin');break;
    case 'users':go('users');break;
    case 'form':S.vals={userId:'thandi.mokoena',userName:'Sizwe Ndaba',first:'Sizwe',last:'',email:'sizwe.ndaba@vmin',contact:'082 555',emp:'10130',org:'pta'};S.errors=validate(S.vals);go('form');break;
    case 'delete':go('users');openDeleteUser('themba.ndlovu');{const i=$('#confirm');i.value='themba.ndlovu';i.dispatchEvent(new Event('input'))}break;
    case 'invited':go('users');['sipho.dlamini','kagiso.sithole','themba.ndlovu','megan.naidoo','nkosi.z'].forEach(i=>S.sel.add(i));USERS.find(u=>u.id==='sipho.dlamini').state='invited';rows();inviteDlg([...S.sel]);S.sel.clear();rows();break;
    case 'groups':go('groups');break;
    case 'group':S.role='write';go('group',{grp:0});break;
    case 'readonly':S.role='read';go('users');break;
    case 'admin':go('admin');break;
  }
}
$('#jump').onchange=e=>{if(e.target.value)demo(e.target.value);e.target.value=''};
setTheme(false);
window.demo=demo;
demo(location.hash.slice(1)||'signin');
