<!--
PLAN - rendition 05 "Membership board"
1. Direction: membership-centric. Groups screen is a board: People tray at left, one column per group; drag a person in to add, out to the tray to remove.
2. Palette: base #FFFFFF, slate #F3F4F7, ink #1B1E2B, accent violet #5B3FD1, destructive #C62F2F.
3. Group hues (the only multi-colour in the app): teal #0F9BA8, saffron #D99A1E, berry #B23A72, moss #4E8A3A, sky #3B7DD8.
4. Hues appear as the same small swatch wherever a group appears: board columns, tray dots, users list, user form groups field, group detail.
5. Type: Bricolage Grotesque for headings, Inter for UI. Sentence case, plain verbs.
6. Boldness spent only on the board (hue-topped columns, tinted drop zones, drag ghost). Other screens are quiet slate/white with violet for primary actions.
7. Enrollment state is encoded without hues: Enrolled = solid ink, Invited = violet outline, Not invited = dashed.
8. Keyboard alternative to drag: tick people in the tray, then "Add to group..." menu; members have a Remove button.
9. Layout (1440): [header] / [tray 270px | col | col | col | col | col] ; phone: tray stacks above, columns scroll sideways.
10. Not a default: no cards-with-soft-shadow grid, no gradients; columns are the structure.

  +--------+---------+---------+---------+---------+---------+
  | People | Field   | Finance | Drivers | Leaders | Vol.    |
  | [ ] T  | ======= | ======= | ======= | ======= | ======= |
  | [ ] N  |  Thabo  |  Johan  |  ...    |         |         |
  +--------+---------+---------+---------+---------+---------+
-->
<!doctype html>
<html lang="en" data-theme="knox-light">

<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43/daisyui.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style>
[data-theme="knox-light"]{
  color-scheme:light;
  --color-base-100:#FFFFFF; --color-base-200:#F3F4F7; --color-base-300:#DDDFE7; --color-base-content:#1B1E2B;
  --color-primary:#5B3FD1; --color-primary-content:#FFFFFF;
  --color-secondary:#1B1E2B; --color-secondary-content:#FFFFFF;
  --color-accent:#5B3FD1; --color-accent-content:#FFFFFF;
  --color-neutral:#1B1E2B; --color-neutral-content:#FFFFFF;
  --color-info:#3B7DD8; --color-info-content:#FFFFFF;
  --color-success:#3F7A2E; --color-success-content:#FFFFFF;
  --color-warning:#F2C46B; --color-warning-content:#3A2800;
  --color-error:#C62F2F; --color-error-content:#FFFFFF;
  --radius-selector:.5rem; --radius-field:.5rem; --radius-box:.75rem;
  --size-selector:.25rem; --size-field:.25rem; --border:1px; --depth:0; --noise:0;
  --muted:#5A5F73; --lift:rgba(27,30,43,.18);
}
[data-theme="knox-dark"]{
  color-scheme:dark;
  --color-base-100:#1B1E2B; --color-base-200:#13151F; --color-base-300:#2E3246; --color-base-content:#ECEDF3;
  --color-primary:#9A86F2; --color-primary-content:#14112B;
  --color-secondary:#ECEDF3; --color-secondary-content:#1B1E2B;
  --color-accent:#9A86F2; --color-accent-content:#14112B;
  --color-neutral:#2E3246; --color-neutral-content:#ECEDF3;
  --color-info:#6BA0EC; --color-info-content:#0B1730;
  --color-success:#7DBE68; --color-success-content:#0E2008;
  --color-warning:#F2C46B; --color-warning-content:#3A2800;
  --color-error:#EE6B6B; --color-error-content:#2A0808;
  --radius-selector:.5rem; --radius-field:.5rem; --radius-box:.75rem;
  --size-selector:.25rem; --size-field:.25rem; --border:1px; --depth:0; --noise:0;
  --muted:#A3A8BD; --lift:rgba(0,0,0,.5);
}
html{font-family:Inter,system-ui,sans-serif;background:var(--color-base-200)}
body{min-height:100vh}
h1,h2,h3,.brand,.display{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* group swatch: the one recurring colour device */
.sw{display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;background:var(--h);flex:none}
.sw-lg{width:1rem;height:1rem;border-radius:.3rem}
.gchip{display:inline-flex;align-items:center;gap:.4rem;padding:.15rem .55rem .15rem .45rem;border-radius:999px;border:1px solid var(--color-base-300);font-size:.8rem;background:var(--color-base-100)}
.gdots{display:inline-flex;gap:.2rem}

/* enrollment state: shape, not hue */
.st{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:.12rem .6rem;border-radius:999px}
.st-enrolled{background:var(--color-base-content);color:var(--color-base-100)}
.st-invited{border:1.5px solid var(--color-primary);color:var(--color-primary)}
.st-none{border:1.5px dashed var(--muted);color:var(--muted)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:260px 1fr;gap:1rem;align-items:start}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:.75rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x proximity}
.col{scroll-snap-align:start;background:color-mix(in srgb,var(--h) 9%,var(--color-base-100));border-top:6px solid var(--h);border-radius:.25rem .25rem var(--radius-box) var(--radius-box);min-height:30rem;display:flex;flex-direction:column;transition:outline-color .12s,background .12s;outline:2px dashed transparent;outline-offset:3px}
.col-head{padding:.7rem .75rem .5rem;display:flex;align-items:center;gap:.5rem}
.col-head h3{font-size:1.05rem;font-weight:700;line-height:1.2;flex:1;min-width:0}
.col-count{font-weight:700;font-size:.85rem;background:var(--color-base-100);border-radius:999px;padding:0 .5rem;border:1px solid color-mix(in srgb,var(--h) 40%,transparent)}
.col-body{padding:.25rem .6rem .75rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.col-empty{margin:auto;text-align:center;font-size:.85rem;color:var(--muted);padding:1rem .5rem}
.person{display:flex;align-items:center;gap:.5rem;background:var(--color-base-100);border:1px solid var(--color-base-300);border-radius:.6rem;padding:.4rem .5rem;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:pan-y}
.person .grip{touch-action:none;cursor:grab;color:var(--muted);padding:.1rem .15rem;line-height:0}
.col .person .grip{display:none}.col .person{border-left:4px solid var(--h);padding:.4rem .35rem}.col .person .nm{overflow-wrap:anywhere}
.person .nm{font-size:.88rem;font-weight:600;line-height:1.2}
.person .id{font-size:.74rem;color:var(--muted)}
.person.sel{border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary)}
.ava{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--color-base-200);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}
.col .ava{background:color-mix(in srgb,var(--h) 22%,var(--color-base-100))}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
body.dragging .col[data-drop]:not(.over){outline-color:color-mix(in srgb,var(--h) 55%,transparent)}
.col.over{outline:3px solid var(--h);background:color-mix(in srgb,var(--h) 20%,var(--color-base-100))}
.person.lifted{opacity:.35}
.ghost{position:fixed;z-index:100;pointer-events:none;width:230px;transform:rotate(-2deg);box-shadow:0 14px 28px var(--lift);background:var(--color-base-100);border:2px solid var(--color-primary);border-radius:.7rem;padding:.4rem .55rem;display:flex;align-items:center;gap:.5rem}
.ghost .n{background:var(--color-primary);color:var(--color-primary-content);border-radius:999px;font-size:.75rem;font-weight:700;padding:0 .45rem;margin-left:auto}
.tray{background:var(--color-base-100);border:1px solid var(--color-base-300);border-radius:var(--radius-box);position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);display:flex;flex-direction:column;outline:2px dashed transparent;outline-offset:3px}
.tray-list{overflow:auto;padding:.4rem .6rem .7rem;display:flex;flex-direction:column;gap:.35rem;min-height:8rem}
.tray .person{cursor:grab}
.tray .person .cb{flex:none}
.tray-drop{display:none;position:absolute;inset:0;border-radius:var(--radius-box);background:color-mix(in srgb,var(--color-error) 12%,var(--color-base-100));border:2px dashed var(--color-error);align-content:center;text-align:center;font-weight:600;padding:1rem;z-index:5;color:var(--color-base-content)}
body.dragging-member .tray-drop{display:grid}
.tray.over .tray-drop{background:color-mix(in srgb,var(--color-error) 24%,var(--color-base-100))}
.tray{position:sticky}
.trayw{position:relative}
.toast{position:fixed;left:1rem;bottom:1rem;z-index:90;background:var(--color-neutral);color:var(--color-neutral-content);padding:.6rem .9rem;border-radius:.6rem;font-size:.9rem;max-width:min(26rem,calc(100vw - 2rem))}
.dropdown-content.menu{z-index:60}

/* app chrome */
.appbar{background:var(--color-base-100);border-bottom:1px solid var(--color-base-300)}
.navlink{padding:.4rem .75rem;border-radius:.5rem;font-weight:500}
.navlink[aria-current=page]{background:var(--color-base-200);font-weight:600;box-shadow:inset 0 -3px 0 var(--color-primary)}
.panel{background:var(--color-base-100);border:1px solid var(--color-base-300);border-radius:var(--radius-box)}
.hue-bar{display:flex;height:6px}.hue-bar i{flex:1}
.field-err{color:var(--color-error);font-size:.85rem;margin-top:.25rem}
.input-bad{border-color:var(--color-error)!important}
.alert-soft{color:var(--color-base-content)}
.dis-reason{font-size:.82rem;color:var(--muted)}
@media (max-width:900px){
  .board{grid-template-columns:1fr}
  .tray{position:static;max-height:22rem}
  .cols{grid-auto-columns:78%}
  .split{grid-template-columns:1fr!important}
}
.split{display:grid;gap:1rem;align-items:start}
</style>
</head>
<body>

const U=[

['z.mthembu','Zanele','Mthembu','zanele.mthembu@vmin.example','Pretoria','Enrolled','+27 82 555 0152','E1075'],
['j.botha','Johan','Botha','johan.botha@vmin.example','Head Office','Invited','+27 82 555 0131','E1002'],
['f.adams','Fatima','Adams','fatima.adams@vmin.example','Cape Town','Enrolled','+27 79 555 0116','E1081'],
['m.sithole','Mandla','Sithole','mandla.sithole@vmin.example','Gauteng','Not invited','+27 61 555 0190','E1088'],

const SCREENS=[['signin','1 Sign in'],['users','2 Users list'],['form','3 Edit user'],['delete','4 Delete user'],['invited','5 Invite sent'],['groups','6 Groups board'],['group','7 Group detail (coordinator)'],['readonly','8 Read-only coordinator'],['admin','9 Admin']];
const ROLES={admin:'Admin',coordw:'Gauteng coordinator (read-write)',coordr:'Gauteng coordinator (read-only)'};

const S={route:'signin',role:'admin',sel:new Set(),filterOrg:'Head Office',q:'',trayq:'',gid:'field',pick:'',tab:'accounts',invSel:new Set(['n.dlamini','l.khumalo','r.jacobs','q.unknown'])};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const scoped=()=>S.role!=='admin';

const isAdmin=()=>S.role==='admin';
const inScope=u=>!scoped()||GAUTENG.includes(u.org);
const vis=()=>U.filter(inScope);
const ini=u=>u.fn[0]+u.ln.split(' ').pop()[0];
const stCls={Enrolled:'st-enrolled',Invited:'st-invited','Not invited':'st-none'};
const stateBadge=s=>`<span class="st ${stCls[s]}">${s}</span>`;
const sw=g=>`<i class="sw" style="--h:${g.h}" aria-hidden="true"></i>`;
const gOf=u=>G.filter(g=>g.m.has(u.id));
const dots=u=>`<span class="gdots">${gOf(u).map(g=>`<i class="sw" style="--h:${g.h}" title="${esc(g.name)}"></i>`).join('')}</span>`;
const gdotsText=u=>gOf(u).map(g=>g.name).join(', ')||'No groups';
const ICON={
 grip:'<svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="4" cy="9" r="1.6"/><circle cx="10" cy="9" r="1.6"/><circle cx="4" cy="14" r="1.6"/><circle cx="10" cy="14" r="1.6"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>',
 sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}

/* ---------- chrome ---------- */
function chrome(inner){
  const nav=(r,l,cur)=>`<a class="navlink" href="#${r}" ${cur?'aria-current="page"':''}>${l}</a>`;
  const r=S.route; const grp=['groups','group','readonly'].includes(r), usr=['users','form','delete','invited'].includes(r);
  return `<header class="appbar"><div class="max-w-[1400px] mx-auto px-4 py-2 flex flex-wrap items-center gap-x-4 gap-y-2">

    <nav class="flex gap-1" aria-label="Main">${nav('users','Users',usr)}${nav(canWrite()?'groups':'readonly','Groups',grp)}${isAdmin()?nav('admin','Admin',r==='admin'):''}</nav>
    <div class="ml-auto flex flex-wrap items-center gap-2">
      <label class="flex items-center gap-2 text-sm muted whitespace-nowrap">Screen
        <select class="select select-sm" data-act="screen" aria-label="Jump to screen">${SCREENS.map(s=>`<option value="${s[0]}" ${s[0]===r?'selected':''}>${s[1]}</option>`).join('')}</select></label>
      <label class="flex items-center gap-2 text-sm muted whitespace-nowrap">Viewing as
        <select class="select select-sm" data-act="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===S.role?'selected':''}>${v}</option>`).join('')}</select></label>
      <button class="btn btn-sm btn-ghost btn-square" data-act="theme" aria-label="Toggle light and dark theme">${ICON.sun}</button>
      <a class="btn btn-sm btn-ghost" href="#signin">Sign out</a>
    </div></div></header>
    <main class="max-w-[1400px] mx-auto px-4 py-5">${inner}</main>`;
}

/* ---------- 1 sign in ---------- */
function signin(){
  return `<div class="min-h-screen grid place-items-center p-4"><div class="w-full max-w-md">
   <div class="hue-bar rounded-t" aria-hidden="true">${HUES.map(h=>`<i style="background:${h}"></i>`).join('')}</div>

    <button type="button" class="btn btn-ghost btn-sm" data-act="theme">Switch light or dark theme</button>
   </form></div></div>`;
}

/* ---------- 2 users ---------- */
function orgTree(){
  return `<nav aria-label="Organizations" class="panel p-2"><div class="font-semibold px-2 py-1">Organization</div>
   <ul class="flex flex-col">${ORGS.map(([o,d])=>`<li><button class="w-full text-left rounded px-2 py-1.5 text-sm hover:bg-[var(--color-base-200)] ${S.filterOrg===o?'font-semibold bg-[var(--color-base-200)]':''}" style="padding-left:${.5+d*1}rem" data-act="org" data-v="${esc(o)}" ${S.filterOrg===o?'aria-current="true"':''}>${esc(o)}</button></li>`).join('')}</ul>
   <p class="text-xs muted px-2 pt-2">Includes sub-organizations.</p></nav>`;
}
function usersList(){
  const q=S.q.toLowerCase();
  const rows=vis().filter(u=>SUBTREE[S.filterOrg].includes(u.org)&&(!q||(u.id+u.name+u.email).toLowerCase().includes(q)));
  const n=[...S.sel].filter(id=>rows.some(r=>r.id===id)).length;
  const all=rows.length&&rows.every(r=>S.sel.has(r.id));
  const w=canWrite();
  return `<div class="flex flex-wrap items-end gap-3 mb-4"><div><h1 class="text-3xl font-bold">Users</h1><p class="muted text-sm">${rows.length} in ${esc(S.filterOrg)} and its sub-organizations</p></div>
    <div class="ml-auto flex flex-wrap gap-2 items-center">
     <button class="btn btn-primary" ${n&&w?'':'disabled'} data-act="invite">Send enrollment invite${n?` (${n})`:''}</button>
     <a class="btn ${w?'btn-neutral':''}" ${w?'href="#form"':'aria-disabled="true" tabindex="-1" style="pointer-events:none;opacity:.5"'}>Add user</a></div></div>
   ${w?'':`<p class="dis-reason mb-3">Your access to Gauteng is read-only, so inviting and adding users are turned off.</p>`}
   <div class="split" style="grid-template-columns:220px 1fr">
    ${scoped()?'<div></div>':orgTree()}

/* ---------- render ---------- */
function render(){
  const r=S.route; let html;
  if(r==='signin')html=signin();
  else{
    const inner={users:usersList,form:formScreen,delete:usersList,invited:invited,groups:board,readonly:board,group:groupDetail,admin:admin}[r]();
    html=chrome(inner);
  }
  const keep=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.act;
  $('#app').innerHTML=html;
  if(keep==='q'||keep==='trayq'||keep==='pick'){const el=$(`[data-act=${keep}]`);if(el){el.focus();el.setSelectionRange?.(el.value.length,el.value.length)}}
  document.title='knoxmgr - '+(SCREENS.find(s=>s[0]===r)||[0,r])[1].replace(/^\d /,'');
}
function go(){
  const r=location.hash.slice(1)||'signin';
  if(!SCREENS.some(s=>s[0]===r))return;
  S.route=r;
  if(r==='users'||r==='delete'){ if(S.role!=='admin'&&S.filterOrg==='Head Office')S.filterOrg='Gauteng'; }
  if(r!=='delete'&&$('#dlg').open)$('#dlg').close();
  $('#toast').hidden=true; render(); if(r==='delete')openDelete();
}
addEventListener('hashchange',go);

/* ---------- membership ops ---------- */
function addTo(gid,ids){
  const g=GBY()[gid]; const add=ids.filter(i=>!g.m.has(i)); add.forEach(i=>g.m.add(i));
  const skipped=ids.length-add.length;
  toast(add.length?`Added ${add.length===1?UBY[add[0]].name:add.length+' people'} to ${g.name}.${skipped?` ${skipped} already in the group.`:''}`:`Already in ${g.name}. Nothing changed.`);
  S.sel.clear(); render();
}
function removeFrom(gid,ids){const g=GBY()[gid];ids.forEach(i=>g.m.delete(i));toast(`Removed ${ids.length===1?UBY[ids[0]].name:ids.length+' people'} from ${g.name}.`);render()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(drag&&drag.moved)return;
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,g=el.dataset.g;
  switch(a){
   case 'theme':{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='knox-dark'?'knox-light':'knox-dark';break}
   case 'org':S.filterOrg=v;render();break;
   case 'sel':el.checked?S.sel.add(v):S.sel.delete(v);render();break;
   case 'selall':{const q=S.q.toLowerCase();vis().filter(u=>SUBTREE[S.filterOrg].includes(u.org)&&(!q||(u.id+u.name+u.email).toLowerCase().includes(q))).forEach(u=>el.checked?S.sel.add(u.id):S.sel.delete(u.id));render();break}
   case 'invite':S.invSel=new Set([...S.sel,'q.unknown']);location.hash='invited';break;
   case 'traysel':el.checked?S.sel.add(v):S.sel.delete(v);render();break;
   case 'addsel':if(document.activeElement)document.activeElement.blur();addTo(g,[...S.sel]);break;
   case 'remove':removeFrom(g,[v]);break;
   case 'addone':addTo(g,[v]);break;
   case 'open':S.gid=g;break;
   case 'tab':S.tab=v;render();break;
   case 'closedlg':$('#dlg').close();location.hash='users';break;
   case 'newgroup':case 'delgroup':groupDialog(a,g);break;
   case 'confirmcreate':{const n=$('#gname').value.trim();if(!n){$('#gerr').textContent='Enter a group name, for example Regional leads.';$('#gname').classList.add('input-bad');return}
     G.push({id:'g'+G.length,name:n,h:HUES[G.length%5],m:new Set()});$('#dlg').close();toast(`Created ${n}.`);render();break}
   case 'confirmdel':{const i=G.findIndex(x=>x.id===g);const n=G[i].name;G.splice(i,1);$('#dlg').close();toast(`Deleted ${n}. Its members still exist in Knox.`);render();break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='screen'){if(ROUTE_ROLE[el.value])S.role=ROUTE_ROLE[el.value];if(location.hash==='#'+el.value)go();else location.hash=el.value}
  if(el.dataset.act==='role'){S.role=el.value;const r=S.route;
    const dest=scoped()&&r==='admin'?'users':(['groups','readonly'].includes(r)?(canWrite()?'groups':'readonly'):r);
    if(location.hash==='#'+dest)go();else location.hash=dest}
  if(el.dataset.act==='gsel'){S.gid=el.value;render()}
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='q'){S.q=el.value;render()}
  if(el.dataset.act==='trayq'){S.trayq=el.value;render()}
  if(el.dataset.act==='pick'){S.pick=el.value;render()}
  if(el.dataset.act==='confirm'){$('#delbtn').disabled=el.value!==el.dataset.v}
});
function groupDialog(kind,gid){
  const g=gid&&GBY()[gid];
  $('#dlgbox').innerHTML=kind==='newgroup'
   ?`<h2 class="text-2xl font-bold" id="dt">Create group</h2><label class="flex flex-col gap-1 text-sm font-medium mt-4">Group name<input id="gname" class="input w-full" autocomplete="off"><span id="gerr" class="field-err font-normal"></span></label><p class="text-xs muted mt-2">The group gets the next colour in the set, and keeps it everywhere it appears.</p><div class="modal-action"><button class="btn" onclick="$('#dlg').close()">Cancel</button><button class="btn btn-primary" data-act="confirmcreate">Create group</button></div>`
   :`<h2 class="text-2xl font-bold" id="dt">Delete ${esc(g.name)}?</h2><p class="mt-2">${g.m.size} members will leave this group. The people stay in Knox. This cannot be undone.</p><div class="modal-action"><button class="btn" onclick="$('#dlg').close()">Cancel</button><button class="btn btn-error" data-act="confirmdel" data-g="${gid}">Delete group</button></div>`;
  $('#dlg').setAttribute('aria-labelledby','dt');$('#dlg').showModal();
}

/* ---------- pointer drag ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]'); if(!el||!canWrite()||e.button>0)return;
  if(e.target.closest('input,button,a')||(e.pointerType==='touch'&&!e.target.closest('.grip')))return;
  const id=el.dataset.drag, from=el.dataset.from||null;
  drag={el,id,from,x:e.clientX,y:e.clientY,moved:false,ids:!from&&S.sel.has(id)?[...S.sel]:[id]};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;
    drag.moved=true; document.body.classList.add('dragging'); if(drag.from)document.body.classList.add('dragging-member');
    const u=UBY[drag.id], gh=document.createElement('div'); gh.className='ghost';
    gh.innerHTML=`<span class="ava">${ini(u)}</span><span><b class="text-sm">${esc(u.name)}</b></span>${drag.ids.length>1?`<span class="n">${drag.ids.length}</span>`:''}`;
    document.body.appendChild(gh); drag.ghost=gh; drag.el.classList.add('lifted'); }
  drag.ghost.style.left=(e.clientX-24)+'px'; drag.ghost.style.top=(e.clientY-18)+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');
  if(drag.over!==t){drag.over?.classList.remove('over');t?.classList.add('over');drag.over=t}
});
function endDrag(drop){
  if(!drag)return; const d=drag; drag=null;
  d.ghost?.remove(); d.over?.classList.remove('over'); d.el.classList.remove('lifted');
  document.body.classList.remove('dragging','dragging-member');
  if(d.moved){
    if(drop&&d.over){const t=d.over.dataset.drop;
      if(t==='tray'){ if(d.from)removeFrom(d.from,d.ids); }
      else addTo(t,d.ids);} }
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag)endDrag(false)});
go();
</script>
