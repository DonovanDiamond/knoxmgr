<!DOCTYPE html>
<!--
PLAN - rendition 02 "Org explorer"
1. Palette: graphite #262A31, surface #FBFBFC, line #E3E5E9, indigo #4453C9 (actions, selection), rose #C2334D (destructive only).
   Dark theme: surface #1E2127, panes #262A31, lines #363B44, indigo lifts to #8A96F0, rose to #E5738A.
2. Type: Manrope for all UI at 13px body; JetBrains Mono ONLY for userIds and empNo values, never labels.
3. Structure: Miller columns. Pane 1 = hierarchy (orgs / groups), pane 2 = people in it, pane 3 = the selected person.
   Depth is encoded by pane position; selection is carried left to right by an indigo rail on the selected row.
4. Boldness is spent in one place: the Ctrl/Cmd-K command palette (jump to person, group, screen or action).
   Everything else is flat, line-separated panes, no cards, no shadows except the palette and dialogs.
5. Keycaps sit beside actions (N, E, I, Del, /) and are real shortcuts.
6. Enrollment state = coloured dot + word (Enrolled / Invited / Not invited), never colour alone.
7. Coordinators see the same shape with a scoped tree root and disabled writes that say why.

  +--------+----------------+-------------------+
  | Org    | People in org  | Selected person   |
  | tree   | (search, multi)| edit/invite/groups|
  | 232px  | flexible       | flexible, 400+    |
  +--------+----------------+-------------------+

Check: not cream/terracotta, not near-black+acid, no hairline broadsheet, no card grid, no gradients. Passes.
-->
<html lang="en" data-theme="knox-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knoxmgr - Org explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43/daisyui.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style>
:root, [data-theme="knox-light"] {
  color-scheme: light;
  --color-base-100: #FBFBFC; --color-base-200: #F3F4F6; --color-base-300: #E3E5E9;
  --color-base-content: #262A31;
  --color-primary: #4453C9; --color-primary-content: #ffffff;
  --color-neutral: #262A31; --color-neutral-content: #FBFBFC;
  --color-error: #C2334D; --color-error-content: #ffffff;
  --color-success: #2F7D5B; --color-warning: #A86A12; --color-info: #4453C9;
  --muted: #5B6270; --sel: #E8EAFA; --pane: #FBFBFC; --pane2: #F3F4F6;
  --radius-field: .375rem; --radius-box: .5rem; --radius-selector: .25rem;
  --size-field: .25rem; --border: 1px;
}
[data-theme="knox-dark"] {
  color-scheme: dark;
  --color-base-100: #1E2127; --color-base-200: #262A31; --color-base-300: #363B44;
  --color-base-content: #E6E8EC;
  --color-primary: #8A96F0; --color-primary-content: #12142B;
  --color-neutral: #E6E8EC; --color-neutral-content: #1E2127;
  --color-error: #E5738A; --color-error-content: #2A0A12;
  --color-success: #5FBF94; --color-warning: #E0A650; --color-info: #8A96F0;
  --muted: #9AA1AE; --sel: #2E3350; --pane: #1E2127; --pane2: #23272E;
}
html, body { height: 100%; }
body { font-family: Manrope, system-ui, sans-serif; font-size: 13px; line-height: 1.45; background: var(--color-base-100); color: var(--color-base-content); margin: 0; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
button { font: inherit; }
.app { display: grid; grid-template-rows: 44px 1fr; height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--color-base-300); background: var(--color-base-100); min-width: 0; }
.brand { font-weight: 800; font-size: 14px; letter-spacing: -.01em; display: flex; gap: 7px; align-items: center; }
.brand i { width: 14px; height: 14px; border-radius: 3px; background: var(--color-primary); display: inline-block; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tab { padding: 5px 9px; border-radius: 6px; color: var(--muted); white-space: nowrap; border: 0; background: none; cursor: pointer; font-weight: 600; }
.tab:hover { background: var(--color-base-200); }
.tab[aria-current="true"] { color: var(--color-primary); background: var(--sel); }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; font: 600 11px Manrope, sans-serif; color: var(--muted); border: 1px solid var(--color-base-300); border-bottom-width: 2px; border-radius: 4px; background: var(--color-base-100); }
.btn { font-weight: 600; font-size: 13px; }
.btn-primary .kbd { color: #fff; background: transparent; border-color: rgba(255,255,255,.45); }
[data-theme="knox-dark"] .btn-primary .kbd { color: #12142B; border-color: rgba(18,20,43,.5); }
.btn-danger { background: transparent; color: var(--color-error); border: 1px solid var(--color-error); }
.btn-danger:hover:not(:disabled) { background: var(--color-error); color: var(--color-error-content); }
.btn-danger-solid { background: var(--color-error); color: var(--color-error-content); border: 1px solid var(--color-error); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.cmdk { display: flex; align-items: center; gap: 8px; min-width: 190px; padding: 5px 8px; border: 1px solid var(--color-base-300); border-radius: 7px; background: var(--color-base-200); color: var(--muted); cursor: pointer; }
.cmdk:hover { border-color: var(--color-primary); }
.who { color: var(--muted); white-space: nowrap; }

.cols { display: grid; grid-template-columns: 236px minmax(300px, 1fr) minmax(360px, 1.15fr); min-height: 0; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--color-base-300); background: var(--pane); }
.pane:last-child { border-right: 0; }
.pane.first { background: var(--pane2); }
.ph { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--color-base-300); min-height: 46px; }
.ph h2 { margin: 0; font-size: 13px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }
.row { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 12px; border: 0; background: none; color: inherit; cursor: pointer; border-left: 3px solid transparent; }
.row:hover { background: var(--color-base-200); }
.pane.first .row:hover { background: var(--color-base-300); }
.row[aria-selected="true"] { background: var(--sel); border-left-color: var(--color-primary); }
.row .t { font-weight: 600; }
.row .s { color: var(--muted); font-size: 12px; }
.row .grow { flex: 1; min-width: 0; }
.row .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.st-Enrolled .dot { background: var(--color-success); }
.st-Invited .dot { background: var(--color-warning); }
.st-Notinvited .dot { background: transparent; border: 1.5px solid var(--muted); }
.search { padding: 8px 12px; border-bottom: 1px solid var(--color-base-300); display: flex; gap: 8px; align-items: center; }
.input, .select { font-size: 13px; background: var(--color-base-100); }
.field label { display: block; font-weight: 700; margin-bottom: 3px; }
.field .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
.field .err { color: var(--color-error); font-size: 12px; margin-top: 3px; font-weight: 600; }
.input.bad { border-color: var(--color-error); }
.detail { padding: 16px; overflow-y: auto; flex: 1; min-height: 0; }
dl.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border: 1px solid var(--color-base-300); border-radius: 999px; font-weight: 600; margin: 0 4px 4px 0; background: var(--color-base-100); }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 18px; height: 18px; border-radius: 50%; line-height: 1; }
.chip button:hover { color: var(--color-error); }
.note { padding: 8px 12px; border-bottom: 1px solid var(--color-base-300); background: var(--sel); font-weight: 600; }
.note.ro { background: color-mix(in srgb, var(--color-warning) 14%, var(--color-base-100)); }
.empty { padding: 28px 18px; color: var(--muted); }
.empty b { display: block; color: var(--color-base-content); font-size: 14px; margin-bottom: 4px; }
.rule { border: 0; border-top: 1px solid var(--color-base-300); margin: 16px 0; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.overlay { position: fixed; inset: 0; background: rgba(20,22,27,.5); display: flex; z-index: 50; }
.dialog { background: var(--color-base-100); border: 1px solid var(--color-base-300); border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
/* the one bold element */
.pal { margin: 11vh auto auto; width: min(640px, calc(100vw - 24px)); background: #262A31; color: #ECEEF2; border-radius: 12px; border: 1px solid #3F4550; box-shadow: 0 0 0 4px rgba(68,83,201,.45), 0 28px 70px rgba(0,0,0,.5); overflow: hidden; max-height: 70vh; display: flex; flex-direction: column; }
.pal input { background: transparent; border: 0; outline: 0; color: #fff; font: 600 16px Manrope, sans-serif; width: 100%; padding: 16px 18px; border-bottom: 1px solid #3F4550; }
.pal input::placeholder { color: #8D94A2; }
.pal .grp { padding: 10px 18px 4px; color: #9AA1AE; font-weight: 700; font-size: 12px; }
.pal .it { display: flex; gap: 10px; align-items: center; padding: 8px 18px; cursor: pointer; border-left: 3px solid transparent; }
.pal .it[aria-selected="true"] { background: #343A6E; border-left-color: #8A96F0; }
.pal .it .m { color: #9AA1AE; font-size: 12px; margin-left: auto; white-space: nowrap; }
.pal .it.rose .l { color: #F08CA0; }
.pal .kbd { background: #1E2127; border-color: #4A5160; color: #C4C9D4; }
.pal .foot { display: flex; gap: 14px; padding: 8px 18px; border-top: 1px solid #3F4550; color: #9AA1AE; font-size: 12px; }
.pal .res { overflow-y: auto; padding-bottom: 6px; }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-weight: 700; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--color-base-300); position: sticky; top: 0; background: var(--color-base-100); }
.table td { padding: 8px 12px; border-bottom: 1px solid var(--color-base-300); vertical-align: top; }
.pill { padding: 1px 7px; border-radius: 4px; border: 1px solid var(--color-base-300); font-weight: 600; font-size: 12px; }
.signin { display: grid; place-items: center; padding: 20px; overflow: auto; }
@media (max-width: 960px) {
  .cols { grid-template-columns: 1fr; overflow-y: auto; grid-auto-rows: min-content; }
  .pane { border-right: 0; border-bottom: 1px solid var(--color-base-300); }
  .scroll { max-height: 46vh; }
  .cmdk span.lbl, .who { display: none; }
  .cmdk { min-width: 0; }
  .detail { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const ORGS = [
  { c: 'HO', n: 'Head Office', p: null },
  { c: 'GP', n: 'Gauteng', p: 'HO' }, { c: 'JHB', n: 'Johannesburg', p: 'GP' }, { c: 'PTA', n: 'Pretoria', p: 'GP' },
  { c: 'WC', n: 'Western Cape', p: 'HO' }, { c: 'CPT', n: 'Cape Town', p: 'WC' },
  { c: 'KZN', n: 'KwaZulu-Natal', p: 'HO' },
];
const U = [
  ['thandi.mokoena','Thandi','Mokoena','thandi.mokoena@vm.example','082 555 0142','E1001','JHB','Enrolled'],
  ['sipho.nkosi','Sipho','Nkosi','sipho.nkosi@vm.example','071 555 0188','E1002','JHB','Invited'],
  ['lerato.molefe','Lerato','Molefe','lerato.molefe@vm.example','083 555 0119','E1003','PTA','Enrolled'],
  ['pieter.vdmerwe','Pieter','van der Merwe','pieter.vdm@vm.example','084 555 0107','E1004','PTA','Not invited'],
  ['nomvula.dlamini','Nomvula','Dlamini','','072 555 0163','E1005','GP','Not invited'],
  ['johan.botha','Johan','Botha','johan.botha@vm.example','082 555 0171','E1006','CPT','Enrolled'],
  ['fatima.adams','Fatima','Adams','fatima.adams@vm.example','079 555 0125','E1007','CPT','Invited'],
  ['zanele.khumalo','Zanele','Khumalo','zanele.khumalo@vm.example','073 555 0136','E1008','KZN','Enrolled'],
  ['bongani.zulu','Bongani','Zulu','bongani.zulu@vm.example','060 555 0194','E1009','KZN','Not invited'],
  ['annelie.pretorius','Annelie','Pretorius','annelie.p@vm.example','081 555 0152','E1010','WC','Enrolled'],
  ['themba.ndlovu','Themba','Ndlovu','','076 555 0148','E1011','JHB','Not invited'],
  ['michelle.naidoo','Michelle','Naidoo','michelle.naidoo@vm.example','082 555 0129','E1012','HO','Enrolled'],
  ['kagiso.sithole','Kagiso','Sithole','kagiso.sithole@vm.example','071 555 0177','E1013','HO','Invited'],
  ['ayanda.mthembu','Ayanda','Mthembu','ayanda.mthembu@vm.example','083 555 0103','E1014','PTA','Enrolled'],
  ['riaan.coetzee','Riaan','Coetzee','riaan.coetzee@vm.example','084 555 0166','E1015','JHB','Not invited'],
].map(a => ({ id:a[0], first:a[1], last:a[2], email:a[3], phone:a[4], emp:a[5], org:a[6], st:a[7] }));
const G = {
  'Field Staff': ['thandi.mokoena','sipho.nkosi','lerato.molefe','johan.botha','zanele.khumalo','bongani.zulu','riaan.coetzee','themba.ndlovu'],
  'Finance': ['michelle.naidoo','annelie.pretorius','pieter.vdmerwe'],
  'Drivers': ['sipho.nkosi','themba.ndlovu','riaan.coetzee','bongani.zulu','ayanda.mthembu'],
  'Leadership': ['michelle.naidoo','kagiso.sithole','thandi.mokoena'],
  'Volunteers 2026': ['fatima.adams','nomvula.dlamini','lerato.molefe','ayanda.mthembu','johan.botha','zanele.khumalo','pieter.vdmerwe'],
};
const SCREENS = [['signin','Sign in'],['users','Users'],['form','Add / edit user'],['delete','Delete user'],['invite','Invite sent'],['groups','Groups'],['group','Group detail'],['readonly','Read-only'],['admin','Admin']];
const ACCOUNTS = [
  ['donovan','Local','admin','All organizations','Full',false],
  ['kagiso','AD','admin','All organizations','Full',false],
  ['thandi.mokoena','AD','user','Gauteng','Write',false],
  ['nokuthula.sibiya','AD','user','Gauteng','Read',false],
  ['andile.fortuin','Local','user','Western Cape','Write',false],
  ['kobus.venter','AD','user','KwaZulu-Natal','Read',true],
];
const AUDIT = [
  ['Today 09:42','donovan','Sent enrollment invite','sipho.nkosi','Invite state: Not invited'],
  ['Today 09:15','thandi.mokoena','Updated user','lerato.molefe','Contact: 083 555 0100'],
  ['Yesterday 16:03','kagiso','Removed from group Drivers','riaan.coetzee','Group membership: Field Staff, Drivers'],
  ['Yesterday 11:20','donovan','Created group','Volunteers 2026','(none)'],
  ['Mon 14:48','donovan','Deleted user','vusi.mahlangu','Email: vusi.mahlangu@vm.example, Org: KZN, empNo: E0998'],
  ['Mon 08:31','kagiso','Disabled app account','kobus.venter','Disabled: no'],
];

const S = { screen:'users', org:'HO', uid:'thandi.mokoena', sel:new Set(), q:'', mode:'view', draft:null, errors:{}, group:'Field Staff', gmem:'sipho.nkosi', picker:false, pq:'', pickSel:new Set(),
  persona:{ role:'admin', org:'HO', access:'write' }, invite:null, del:false, delText:'', pal:false, pq2:'', pi:0, adminTab:'accounts', open:new Set(), signinDown:false, theme:'knox-light' };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const orgBy = c => ORGS.find(o => o.c === c);
const kids = c => ORGS.filter(o => o.p === c);
const subtree = c => [c, ...kids(c).flatMap(k => subtree(k.c))];
const userBy = id => U.find(u => u.id === id);
const full = u => u.first + ' ' + u.last;
const canWrite = () => S.persona.role === 'admin' || S.persona.access === 'write';
const scope = () => subtree(S.persona.role === 'admin' ? 'HO' : S.persona.org);
const roReason = () => 'Your access to ' + orgBy(S.persona.org).n + ' is read-only';
const kbd = k => `<span class="kbd">${k}</span>`;
const stc = s => s.replace(' ', '');
const st = s => `<span class="st st-${stc(s)}"><span class="dot"></span>${s}</span>`;
const visUsers = () => U.filter(u => scope().includes(u.org));
const orgUsers = () => {
  const ids = subtree(S.org); const q = S.q.trim().toLowerCase();
  return visUsers().filter(u => ids.includes(u.org) && (!q || (full(u) + u.id + u.email + u.emp).toLowerCase().includes(q)));
};
const userGroups = id => Object.keys(G).filter(g => G[g].includes(id));
const wbtn = (cls, label, act, key, extra='') => {
  const off = !canWrite();
  return `<button class="btn btn-sm ${cls}" data-act="${act}" ${off ? 'disabled title="' + esc(roReason()) + '"' : ''} ${extra}>${label}${key ? kbd(key) : ''}</button>`;
};

/* ---------- panes ---------- */
function orgPane() {
  const root = S.persona.role === 'admin' ? 'HO' : S.persona.org;
  const row = (o, d) => {
    const n = visUsers().filter(u => subtree(o.c).includes(u.org)).length;
    return `<button class="row" data-row data-act="org" data-v="${o.c}" aria-selected="${S.org === o.c}" style="padding-left:${12 + d * 16}px">
      <span class="grow t">${esc(o.n)}</span><span class="count">${n}</span></button>` + kids(o.c).map(k => row(k, d + 1)).join('');
  };
  return `<section class="pane first" aria-label="Organizations">
    <div class="ph"><h2>Organizations</h2></div>
    <div class="scroll" style="padding-top:4px">${row(orgBy(root), 0)}</div>
    <div class="note" style="border-top:1px solid var(--color-base-300);border-bottom:0;background:none;font-weight:500;color:var(--muted)">Selecting an organization includes its sub-organizations.</div>
  </section>`;
}
function peoplePane() {
  const list = orgUsers(); const o = orgBy(S.org);
  const allSel = list.length && list.every(u => S.sel.has(u.id));
  const rows = list.map(u => `<div class="row" data-row data-act="user" data-v="${u.id}" tabindex="0" role="option" aria-selected="${S.uid === u.id && S.mode !== 'add'}">
      <input type="checkbox" class="checkbox checkbox-xs checkbox-primary" data-act="tick" data-v="${u.id}" aria-label="Select ${esc(full(u))}" ${S.sel.has(u.id) ? 'checked' : ''}>
      <span class="grow"><div class="t">${esc(full(u))}</div><div class="s"><span class="mono">${u.id}</span>${u.email ? '' : ' - no email'}</div></span>
      ${st(u.st)}</div>`).join('');
  const n = S.sel.size;
  return `<section class="pane" aria-label="People">
    <div class="ph"><h2>${esc(o.n)} <span class="count">${list.length} people</span></h2>${wbtn('btn-primary', 'Add user', 'add', 'N')}</div>
    ${!canWrite() ? `<div class="note ro">${esc(roReason())}. You can view people, not change them.</div>` : ''}
    <div class="search"><input id="q" class="input input-sm w-full" placeholder="Search name, user ID, email, employee no." value="${esc(S.q)}" aria-label="Search people"> ${kbd('/')}</div>
    <div class="ph" style="min-height:38px;padding:6px 12px">
      <label class="bar" style="gap:8px;font-weight:600"><input type="checkbox" class="checkbox checkbox-xs checkbox-primary" data-act="tickall" ${allSel ? 'checked' : ''}> ${n ? n + ' selected' : 'Select all'}</label>
      <span style="flex:1"></span>
      ${wbtn('btn-outline', 'Send enrollment invite', 'invite', 'I', n ? '' : 'disabled title="Select people first"')}
    </div>
    <div class="scroll" role="listbox" aria-label="People list">${rows || `<div class="empty"><b>Nobody matches "${esc(S.q)}"</b>Try a shorter search, or pick a higher organization to include its sub-organizations.</div>`}</div>
  </section>`;
}
function field(k, label, hint, d, err, extra='') {
  return `<div class="field"><label for="f-${k}">${label}</label><input id="f-${k}" data-f="${k}" class="input input-sm w-full ${err ? 'bad' : ''} ${k === 'id' || k === 'emp' ? 'mono' : ''}" value="${esc(d[k] || '')}" ${err ? 'aria-invalid="true"' : ''} ${extra}>
    ${err ? `<div class="err">${esc(err)}</div>` : hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function formPane() {
  const d = S.draft, e = S.errors, add = S.mode === 'add';
  const orgOpts = ORGS.filter(o => scope().includes(o.c)).map(o => `<option value="${o.c}" ${d.org === o.c ? 'selected' : ''}>${esc(o.n)}</option>`).join('');
  return `<section class="pane" aria-label="${add ? 'Add user' : 'Edit user'}">
    <div class="ph"><h2>${add ? 'Add user' : 'Edit ' + esc(full(userBy(S.uid)))}</h2></div>
    <form class="detail" data-form novalidate style="display:grid;gap:12px;align-content:start">

    leave: () => { const g = G[v]; g.splice(g.indexOf(S.uid), 1); render(); },

    gmem: () => { S.gmem = v; S.picker = false; render(); },

document.addEventListener('click', ev => { const it = ev.target.closest('[data-pi]'); if (it) { const x = palItems()[+it.dataset.pi]; if (x && !x.off) { S.pal = false; x.fn(); } } });

  const t = ev.target;

  else if (t.id === 'pq') { S.pq = t.value; render(); }
  else if (t.id === 'pin') { S.pq2 = t.value; S.pi = 0; render(); }

});
document.addEventListener('change', ev => {

});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.dataset.form !== undefined) {
    S.errors = validate(S.draft);
    if (Object.keys(S.errors).length) return render();
    const d = S.draft;
    if (S.mode === 'add') { U.push({ id: d.id, first: d.first, last: d.last, email: d.email, phone: d.phone, emp: d.emp, org: d.org, st: 'Not invited' }); S.uid = d.id; }

document.addEventListener('keydown', ev => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); S.pal = !S.pal; S.pq2 = ''; S.pi = 0; return render(); }

  else if (k === 'e' && canWrite()) document.querySelector('[data-act=edit]')?.click();
