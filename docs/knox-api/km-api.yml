  /group/selectGroups:
    get:
      tags:
      - Group
      summary: Get groups
      description: "Searches existing groups."
      operationId: selectGroups
      parameters:
      - name: groupId
        in: query
        schema:
          maxLength: 50
          type: string
          description: Used when searching by Group ID(UUID).<br/>This field is created
            automatically when create a group.
          example: dc95bc9e4dee47a4a8efd5b6064c9071
      - name: searchName
        in: query
        schema:
          maxLength: 50
          type: string
          description: Used when searching by name.
          example: name1
      - name: groupType
        in: query
        schema:
          maxLength: 10
          type: string
          description: "Group type. <br/>Group types can have only three values:<br/><br/>1)\
            \ User Group: 'USER'<br/>2) Device Group: 'DEVICE'<br/>3) AD/LDAP Group:\
            \ 'SYNC'<br/><br/>In addition, once determined(saved) group type can not\
            \ be modified."
          example: USER
      - name: limit
        in: query
        schema:
          type: string
          description: Records per page (0 < pageSize <= 1000)
          example: "20"
          default: "1000"
      - name: start
        in: query
        schema:
          type: string
          description: Page indexing begins from 0 (pageNum >= 0)
          example: "0"
          default: "0"
      - name: needDeviceUserCount
        in: query
        schema:
          type: string
          description: "Used to request the number of devices, users in the group,\
            \ as well as the number of profiles, contents, and applications assigned\
            \ to the group. When requesting this value, 'yes' should be passed as\
            \ a parameter."
          example: "yes"
          default: "no"
      - name: needActiveDeviceCount
        in: query
        schema:
          type: string
          description: "Used to request the number of active devices in a group. When\
            \ requesting this value, \"yes\" should be passed as a parameter. In addition,\
            \ the 'needDeviceUserCount' value must also be 'yes'."
          example: "yes"
          default: "no"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectGroupRespSchema'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedSchema'
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      security:
      - Bearer-Authentication: []
      x-codeSamples:
      - lang: Curl
        source: "curl -X GET \\\n    https://ap01.manage.samsungknox.com/emm/oapi/group/selectGroups?searchName=test&limit=20\
