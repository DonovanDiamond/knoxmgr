openapi: 3.0.1
info:
  title: Knox Manage API reference
  description: "# INTRODUCTION\nWelcome to the Knox Manage REST API reference. The Knox Manage OpenAPI provides a broad set of operations and resources, which let you:\n\
    - Manage users, devices, organizations, and groups\n
    - Apply policies and send device commands\n
    - Authenticate users and validate licenses\n
    - And much more
    \n## Access the APIs\n
    \nIf you have a Knox Manage tenant, you can access Knox Manage APIs via one of the following region-specific endpoints:\n
    \n| Region            | Base URL for REST Endpoints  \
    |\n|-------------------|----------------------------------------------|\n\
    | Asia Pacific (5) | https://ap01.manage.samsungknox.com/emm/oapi |\n|      \
    \             | https://ap02.manage.samsungknox.com/emm/oapi |\n|            \
    \       | https://ap03.manage.samsungknox.com/emm/oapi |\n|                  \
    \ | https://ap04.manage.samsungknox.com/emm/oapi |\n|                   | https://ap05.manage.samsungknox.com/emm/oapi\
    \ |\n| Europe (8)        | https://eu01.manage.samsungknox.com/emm/oapi |\n| \
    \                  | https://eu02.manage.samsungknox.com/emm/oapi |\n|       \
    \            | https://eu03.manage.samsungknox.com/emm/oapi |\n|             \
    \      | https://eu04.manage.samsungknox.com/emm/oapi |\n|                   |\
    \ https://eu05.manage.samsungknox.com/emm/oapi |\n|                   | https://eu06.manage.samsungknox.com/emm/oapi\
    \ |\n|                   | https://eu07.manage.samsungknox.com/emm/oapi |\n| \
    \                  | https://eu08.manage.samsungknox.com/emm/oapi |\n| North America\
    \ (3) | https://us01.manage.samsungknox.com/emm/oapi |\n|                   |\
    \ https://us02.manage.samsungknox.com/emm/oapi |\n|                   | https://us03.manage.samsungknox.com/emm/oapi\
    \ |\n\n## New Features\n\nFor an overview of latest developer features, check out the [release notes](https://docs.samsungknox.com/dev/knox-manage/release-notes/25-07/).\n\
    \n# Authentication\n\n## OAuth 2.0\n\nAuthenticating\
    \ via OAuth 2.0 requires the following steps:\n\n1. Create an API client\n2. Generate a\
    \ token\n3. Make authenticated requests\n\n>**Note:** If a user is deactivated,\
    \ all of the user's OAuth clients will be automatically deactivated.\n## Create an API\
    \ client\n\nYou must first create an OAuth client using the Knox Manage UI. To do this, you must be an administrator of your Knox Manage tenant.\
    \ This is a one-time operation that generates **Client ID** and **Client\
    \ Secret** values. Please refer to [Manage API clients](https://docs.samsungknox.com/admin/knox-manage/original-console/appendix/manage-open-api/manage-api-clients/) as a prerequisite for the next step.\n\n## Generate a Token\n\nAfter creating\
    \ a client, make a call to obtain a bearer token using the [Generate\
    \ an OAuth token](https://docs.samsungknox.com/admin/knox-manage/original-console/appendix/manage-open-api/manage-api-clients/)\
    \ operation. This operation requires the following parameters:\n\n- `client_id`\
    \ — This is the combination of the `client_id` and `tenant_id` registered for the OAuth client\
    \ in the previous step (`{client_id}@{tenant id}`).\n- `client_secret` —\
    \ The **Client Secret** displayed when you created the OAuth client.\n- `grant_type` — Must be set to `client_credentials`.\n\n\n### Token Request\
    \ URL\n~~~~\nhttps://{Your Region}.manage.samsungknox.com/emm/oauth/token\n~~~~\n\
    \n\n### Request Sample\n~~~~\ncurl -X POST \\\n  https://ap01.manage.samsungknox.com/emm/oauth/token\
    \ \\\n    -H \"Content-Type: application/x-www-form-urlencoded\" \\\n    --data-urlencode\
    \ \"grant_type=client_credentials\" \\\n    --data-urlencode \"client_id=APItest@km.com\"\
    \ \\\n    --data-urlencode \"client_secret=APItestpassword\"\n~~~~\n\n\n### Response\
    \ Sample\n~~~~\n{\n    \"access_token\": \"<token>\"\
    ,\n    \"token_type\": \"bearer\",\n    \"expires_in\": 997331046,\n    \"scope\"\
    : \"read\"\n}\n~~~~\n\n\n>**Note:** The [Generate\
    \ an OAuth token](https://docs.samsungknox.com/admin/knox-manage/original-console/appendix/manage-open-api/manage-api-clients/) response specifies how long the bearer token is valid for. You\
    \ should reuse the bearer token until it's expired. When the token expires, generate a new one.\n\n## Make authenticated requests\n\
    To authenticate subsequent API requests, you must provide a valid bearer token\
    \ in an HTTP header:\n- `Authorization: Bearer {bearer_token}`\n
    \nFor example: \n\n- `Authorization: Bearer <token>`\n\n"
