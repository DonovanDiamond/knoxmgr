              schema:
                $ref: '#/components/schemas/ResponseSchema'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedSchema'
        "403":
          description: Forbidden
        "404":
