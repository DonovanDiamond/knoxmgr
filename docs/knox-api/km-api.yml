            \ Parameter - Not number\n * -105 : Parameter - The number must be greater\
            \ than %d\n * -106 : Parameter - The number must be less than %d\n * -107\
            \ : Parameter - The number must be between than %d and %d\n * -108 : Parameter\
            \ - The string length must be greater than\n * -109 : Parameter - The\
            \ string length must be less than %d\n * -110 : Parameter - The date value\
            \ must be %s format\n * -111 : Parameter - Start-date should be before\
            \ End-date\n * -112 : Parameter - The string should match %s\n * -113\
            \ : Parameter - The subsequence of string should not match or should not\
            \ contain %s\n * -114 : Parameter - The string is not equal to %s with\
            \ case-sensitive\n * -115 : Parameter - The string is not equal to %s\
            \ without case-sensitive\n * -116 : Parameter - The string is only constituted\
            \ by white-space or tab\n * -117 : Parameter - The string's bytes size\
            \ is greater than %d\n * -200 : The number of licenses has been exceeded.\n\
            \ * -201 : Duplicate data exists.\n * -202 : There are no results.\n *\
            \ -204 : Activated device exists.\n * -205 : Data Not found\n * -999 :\
            \ Unknown Error code"
