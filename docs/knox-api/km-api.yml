paths:
  /audit/read:
    post:
      tags:
      - Audit
      summary: Read Audit Log
      description: 'This API is for reading audit logs.'
      operationId: read
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuditLogSearchParam'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAuditLogRespSchema'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedSchema'
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      security:
      - Bearer-Authentication: []
      x-codeSamples:
      - lang: Curl
        source: "curl -X POST \\\n    https://ap01.manage.samsungknox.com/emm/oapi/audit/read\
          \ \\\n    -H \"cache-control: no-cache\" \\\n    -H \"content-type: application/x-www-form-urlencoded\"\
          \ \\\n    -H \"Authorization: bearer <token>\"\
          \ \\\n    -d \"logDate=2020-03-04&locale=en&startLogTime=0:30&endLogTime=11:30\"\
          \ \n "
