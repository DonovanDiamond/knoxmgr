services:
  knoxmock:
    image: knoxmgr-mock:latest
    command: ["-addr", "0.0.0.0:9090", "-client-id", "demo", "-client-secret", "demo-secret"]

  knoxmgr:
    image: knoxmgr:latest
    command: ["-config", "/etc/knoxmgr/config.yaml"]
    depends_on: [knoxmock]
    ports:
      - "8088:8080"
    volumes:
      - ./config.yaml:/etc/knoxmgr/config.yaml:ro
      - data:/var/lib/knoxmgr

volumes:
  data:
