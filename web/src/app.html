<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>knoxmgr</title>
		<script>
			// Runs before first paint so a stored theme choice never flashes the wrong theme.
			// No stored choice leaves data-theme unset so the system preference applies.
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t === 'dark' ? 'fcdark' : 'fclight';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
